# CCCO release map — product bundle versions to encryption certificate
#
# Each mod release (x.x.x) has an embedded .crt file in this directory.
# Fixpack releases (x.x.x.x) share the same encryption certificate as
# their parent mod release — key rotation only happens at mod releases.
#
# Only versions declared here are accepted by the CLI/library (strict).
#
# Maintenance policy: exactly n, n-1, n-2 mod releases are kept (sliding window).
# When a new mod release is added, the oldest entry (n-2) is removed together
# with its cert file and all of its fixpacks.
#
# To add a new mod release (e.g. 1.2.3):
#   1. Add the cert file: ibm-confidential-computing-container-ccco-1.2.3-encrypt.crt
#   2. Add an entry below with its fixpacks (empty list if none yet)
#   3. Remove the oldest mod release entry (n-2) and delete its cert file
#
# To add a fixpack (e.g. 1.2.2.3):
#   1. Add it to the fixpacks list of its parent mod below (no new cert file)
#
# Entries are listed oldest first.

releases:
  - mod: "1.2.0"        # n-2
    fixpacks: []         # placeholder cert (same as former 25.12.0) until a real n-2 cert is available

  - mod: "1.2.1"        # n-1
    fixpacks: []

  - mod: "1.2.2"        # n
    fixpacks:
      - "1.2.2.1"
      - "1.2.2.2"
